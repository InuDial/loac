[workspace]
members = [
    "crates/loac",
    "crates/loac-macros",
    "tests/macro-tests",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[workspace.lints.rust]
unsafe_code = "warn"
