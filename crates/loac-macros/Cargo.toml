[package]
name = "loac-macros"
version = "0.4.0"
edition.workspace = true
rust-version = "1.97.1"
license.workspace = true
description = "Procedural macros for loac"
repository = "https://github.com/InuDial/loac"

[lib]
proc-macro = true
# Runtime-backed examples compile inside `loac-macro-tests`.
doctest = false

[dependencies]
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.3", features = ["full"] }

[lints]
workspace = true
